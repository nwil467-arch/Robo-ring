<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Robo Ring</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0c14}
#game{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="game" src="./Index.html.html?mobilefix=20260917-2" title="Robo Ring"></iframe>
<script>
const frame=document.getElementById('game');
let fixTimer=null;
function applyMobileFixes(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!d)return;
    let s=d.getElementById('launcher-mobile-fix');
    if(!s){
      s=d.createElement('style');s.id='launcher-mobile-fix';
      s.textContent=`
        /* SINGLE PLAYER: joystick bottom-left, dash bottom-right of the actual viewport. */
        body.mobileDevice.inGame #mobileP1Controls.soloMobileLayout{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;pointer-events:none!important}
        body.mobileDevice.inGame #mobileP1Controls.soloMobileLayout .mobileJoystick{position:fixed!important;left:max(12px,env(safe-area-inset-left))!important;right:auto!important;bottom:max(18px,env(safe-area-inset-bottom))!important}
        body.mobileDevice.inGame #mobileP1Controls.soloMobileLayout .mobileDash{position:fixed!important;right:max(12px,env(safe-area-inset-right))!important;left:auto!important;bottom:max(18px,env(safe-area-inset-bottom))!important}
        body.mobileDevice.inGame #mobileP2Controls{display:none!important}
      `;
      d.head.appendChild(s);
    }
    const solo=!!w.singlePlayer;
    const p1=d.getElementById('mobileP1Controls');
    const p2=d.getElementById('mobileP2Controls');
    if(p1)p1.classList.toggle('soloMobileLayout',solo);
    if(solo&&p2)p2.style.setProperty('display','none','important');

    /* TWO PLAYER / P2 DASH FIX: lock P2's dash to the live joystick vector.
       This prevents the dash from using a reversed/stale facing direction. */
    const p2Dash=d.getElementById('mobileDashP2');
    if(p2Dash&&!p2Dash.dataset.directionFix){
      p2Dash.dataset.directionFix='1';
      p2Dash.addEventListener('pointerdown',()=>{
        try{
          const mi=w.eval('mobileInputs');
          const b=w.eval('B');
          if(mi&&b){
            const x=Number(mi.p2.x)||0,y=Number(mi.p2.y)||0;
            if(Math.hypot(x,y)>.08)b.dashAngle=Math.atan2(y,x);
            else b.dashAngle=Number(b.a)||0;
          }
        }catch(e){}
      },{capture:true,passive:true});
    }
  }catch(e){}
}
frame.addEventListener('load',()=>{
  applyMobileFixes();
  if(fixTimer)clearInterval(fixTimer);
  fixTimer=setInterval(applyMobileFixes,250);
});
</script>
</body>
</html>
