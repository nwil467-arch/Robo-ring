<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robo Ring</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0c14}
#game{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="game" src="./Index.html.html" title="Robo Ring"></iframe>
<script>
const frame=document.getElementById('game');
function applySoloMobileLayout(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!d)return;
    let s=d.getElementById('solo-mobile-layout-fix');
    if(!s){
      s=d.createElement('style');s.id='solo-mobile-layout-fix';
      s.textContent=`
        /* Single-player mobile: controls are pinned to opposite bottom corners of the screen. */
        body.mobileDevice.inGame #mobileP1Controls.soloMobileLayout{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;pointer-events:none!important}
        body.mobileDevice.inGame #mobileP1Controls.soloMobileLayout .mobileJoystick{position:fixed!important;left:clamp(12px,4vw,34px)!important;right:auto!important;bottom:max(18px,env(safe-area-inset-bottom))!important}
        body.mobileDevice.inGame #mobileP1Controls.soloMobileLayout .mobileDash{position:fixed!important;right:clamp(12px,4vw,34px)!important;left:auto!important;bottom:max(18px,env(safe-area-inset-bottom))!important}
      `;
      d.head.appendChild(s);
    }
    const solo=!!w.singlePlayer;
    const p1=d.getElementById('mobileP1Controls');
    if(p1)p1.classList.toggle('soloMobileLayout',solo);
  }catch(e){}
}
frame.addEventListener('load',()=>{applySoloMobileLayout();setInterval(applySoloMobileLayout,250);});
</script>
</body>
</html>
